name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # From the framework's minimum (8.2) to the latest PHP (8.5)
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, simplexml, dom
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      # Mago (mago.toml): its formatter, then its linter and analyzer
      - name: Formatting
        run: composer cs

      - name: Lint and static analysis
        run: composer analyse

      - name: Tests
        run: composer test

  # Coverage, on one PHP version: printed in the log, and kept as the job's artifact (Clover
  # XML). Fails below a minimum share of lines (composer coverage), raised as tests are added
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, simplexml, dom
          coverage: pcov

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Tests with coverage
        run: composer coverage

      - name: Summary
        if: ${{ !cancelled() }}
        run: php tools/coverage-summary.php coverage.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml

  # Whether the change touches code: any file but those listed here (the docs, the Claude
  # files, and what neither Infection nor the tests read: the CLI's entry point, the coverage
  # tools, Mago's stubs and configuration). A new file counts as code unless it is listed.
  # On a pull request, the files it changes; on a push to main, those of the pushed commits
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # A file is code when it matches every rule: '**', and none of the excluded paths
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!CLAUDE.md'
              - '!.claude/**'
              - '!bin/**'
              - '!tools/**'
              - '!stubs/**'
              - '!mago.toml'
              - '!.gitignore'

  # Mutation testing (Infection, infection.json5), on one PHP version, when the change touches
  # code (see changes): the Mutation Score Indicator (MSI) and the covered MSI in the job's
  # summary, and the escaped mutants kept as the job's artifact. Fails below a minimum MSI
  # (infection.json5), raised as mutants are killed
  mutation:
    name: Mutation testing
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, simplexml, dom
          coverage: pcov

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Mutation testing
        run: composer mutation

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          jq -r '.stats | "| Mutation Score Indicator (MSI) | Covered MSI | Mutants | Killed | Escaped | Not covered | Timed out |",
            "|---|---|---|---|---|---|---|",
            "| \(.msi)% | \(.coveredCodeMsi)% | \(.totalMutantsCount) | \(.killedCount) | \(.escapedCount) | \(.notCoveredCount) | \(.timeOutCount) |"' \
            build/infection/summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutation
          path: build/infection/
