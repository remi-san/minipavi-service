name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # From the framework's minimum (8.2) to the latest PHP (8.5)
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, simplexml, dom
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      # Mago (mago.toml): its formatter, then its linter and analyzer
      - name: Formatting
        run: composer cs

      - name: Lint and static analysis
        run: composer analyse

      - name: Tests
        run: composer test

  # Coverage, on one PHP version: printed in the log, and kept as the job's artifact (Clover
  # XML). Fails below a minimum share of lines (composer coverage), raised as tests are added
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, simplexml, dom
          coverage: pcov

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Tests with coverage
        run: composer coverage

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
