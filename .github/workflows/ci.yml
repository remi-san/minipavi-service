name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # From the framework's minimum (8.2) to the latest PHP (8.5)
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, simplexml, dom
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      # Mago (mago.toml): its formatter, then its linter and analyzer
      - name: Formatting
        run: composer cs

      - name: Lint and static analysis
        run: composer analyse

      - name: Tests
        run: composer test
