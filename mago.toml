# Mago (https://mago.carthage.software): formatter (composer cs, cs-fix), linter and static
# analyzer of the framework. Run with vendor/bin/mago.
php-version = "8.2.0"

[source]
paths = ["src", "tests", "tools", "bin/minipavi"]
# Read for their types, not checked
includes = ["vendor"]
# Types of the libraries that don't declare them
patches = ["stubs/MiniPaviCli.php"]

[analyzer]
# Fails on any issue, notes included
minimum-fail-level = "Note"
ignore = [
    # Values of unknown type (JSON, form data, request attributes, template data) are read into
    # a variable, then narrowed (is_string()...) before use, which the other checks verify
    "mixed-assignment",
    # A class-string of an interface (Parameters, Message, BackedEnum) is always a concrete
    # class's here: the type a controller declares, an enum of messages or of settings
    "possibly-static-access-on-interface",
    # Interfaces of enums (a controller's states, messages, a request's keys): PHP allows them to
    # extend BackedEnum
    { code = "invalid-extend", in = ["src/Controller/State.php", "src/Message/Message.php", "src/Minitel/Key.php"] },
    # The state is narrowed to the controller's type with instanceof on its initial state, or
    # found among its cases(), which Mago doesn't follow
    { code = "invalid-return-statement", in = ["src/Core/Routing/Route.php"] },
    { code = "invalid-property-assignment-value", in = ["src/Core/Routing/RouteContext.php"] },
    # Placeholders (of templates and messages) read the property of an object they name
    { code = "string-member-selector", in = ["src/Text/Placeholders.php"] },
    { code = "ambiguous-object-property-access", in = ["src/Text/Placeholders.php"] },
]

[linter]
# Fails on any issue, notes included
minimum-fail-level = "Note"

[linter.rules]
# Size and complexity metrics are not enforced: display elements take their XML attributes as
# parameters, parsers have a branch per element, test classes a method per case
too-many-methods = { enabled = false }
excessive-parameter-list = { enabled = false }
cyclomatic-complexity = { enabled = false }
halstead = { enabled = false }
kan-defect = { enabled = false }
# A test makes PCRE fail (no JIT, a backtrack limit of 0), which only ini_set() can do at run
# time: only that test helper changes a setting, and it puts it back
no-ini-set = { exclude = ["tests/Support/ExhaustedBacktrackLimit.php"] }

# Layers of src/, each using only those below it (mago guard, in composer analyse). At the
# bottom, the helpers; then Minitel (the terminal's facts) <- Vdt (Videotex, and the screen it
# draws) <- Gateway (what MiniPavi sends and is sent); Message (texts) beside them; Page
# (presentation) <- Controller <- Core (routing, context, service) <- Http; Client (how commands
# reach the gateway) <- Http; Cli and Testing at the top. Page, Core, Gateway and Client are
# layered inside too, each sub-namespace with a layer and a rule of its own (Vdt isn't: its
# Playing, Screen and root use each other). Each rule lists all the layers its namespace may
# use (its own, those below it, and theirs), and the libraries it uses.
[guard]
mode = "perimeter"

[guard.perimeter.layers]
helpers = [
    "MiniPaviService\\InvalidValueException",
    "MiniPaviService\\Text\\**",
    "MiniPaviService\\Io\\**",
    "MiniPaviService\\Xml\\**",
    "MiniPaviService\\Html\\**",
]
minitel = ["MiniPaviService\\Minitel\\**"]
vdt = ["MiniPaviService\\Vdt\\**"]
gateway = ["MiniPaviService\\Gateway\\**"]
# Inside Gateway: Command (what a response asks the gateway to do next) <- the request and the
# response
gateway-command = ["MiniPaviService\\Gateway\\Command\\**"]
message = ["MiniPaviService\\Message\\**"]
# A layer's root type (MiniPaviService\Page) belongs to it
page = ["MiniPaviService\\Page", "MiniPaviService\\Page\\**"]
# Inside Page: Display (what is drawn) <- Building (what building a display element needs:
# its builder, and what it reads and throws) <- Template (the nodes of a page's content) <-
# the rest of Page (Parser, which reads the page XML files into templates, and the pages)
page-display = ["MiniPaviService\\Page\\Display\\**"]
page-building = ["MiniPaviService\\Page\\Building\\**"]
page-template = ["MiniPaviService\\Page\\Template\\**"]
controller = ["MiniPaviService\\Controller", "MiniPaviService\\Controller\\**"]
core = ["MiniPaviService\\Core\\**"]
# Inside Core: Routing (the routes and what each keeps) <- Context (the context of a session,
# by route) <- the rest of Core (running a request)
core-routing = ["MiniPaviService\\Core\\Routing\\**"]
core-context = ["MiniPaviService\\Core\\Context\\**"]
client = ["MiniPaviService\\Client\\**"]
# Inside Client: the interfaces <- each client (the browser's, the gateway's), which don't use
# each other
client-interfaces = ["MiniPaviService\\Client\\Client", "MiniPaviService\\Client\\ClientExchange"]
client-html = ["MiniPaviService\\Client\\Html\\**"]
client-minipavi = ["MiniPaviService\\Client\\MiniPavi\\**"]
http = ["MiniPaviService\\Http\\**"]
cli = ["MiniPaviService\\Cli\\**"]
testing = ["MiniPaviService\\Testing\\**"]
# Libraries
psr-http = ["Psr\\Http\\**"]
psr-log = ["Psr\\Log\\**"]
nyholm = ["Nyholm\\**"]
minipavi-cli = ["MiniPavi\\MiniPaviCli"]
symfony-console = ["Symfony\\Component\\Console\\**"]
phpunit = ["PHPUnit\\**"]

[[guard.perimeter.rules]]
